# Builds dist\meowtab.zip from the repo with pinned, hash-checked AutoHotkey and Ahk2Exe,
# so a signed release can be traced back to this source. Runs on version tags or by hand.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  AHK_VERSION: 2.0.28
  AHK_SHA256: b63be7548792b4ad0dfe424d91cc69376694ed2f758245b7a75a0c77d693b478
  AHK2EXE_VERSION: 1.1.37.02a2
  AHK2EXE_SHA256: c29b8c3a5124850d79fc9e66e2ca79677c377d7f31631ad3022ba159c5d9e3be

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the exes' version
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          foreach ($f in 'meowtab.ahk', 'meowtab-classic.ahk') {
            $m = Select-String -Path $f -Pattern '^;@Ahk2Exe-SetVersion\s+(\S+)' | Select-Object -First 1
            if (-not $m) { throw "$f has no ;@Ahk2Exe-SetVersion line." }
            $version = $m.Matches[0].Groups[1].Value
            if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match $f, which is stamped $version." }
          }

      - name: Fetch AutoHotkey and Ahk2Exe
        shell: pwsh
        run: |
          function Get-Pinned($url, $sha256, $dir) {
            $zip = "$dir.zip"
            Invoke-WebRequest $url -OutFile $zip
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($actual -ne $sha256) { throw "SHA-256 mismatch for $url`: $actual" }
            Expand-Archive $zip -DestinationPath $dir
          }
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Get-Pinned "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$env:AHK_VERSION/AutoHotkey_$env:AHK_VERSION.zip" `
            $env:AHK_SHA256 "$tools\ahk"
          Get-Pinned "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe$env:AHK2EXE_VERSION/Ahk2Exe$env:AHK2EXE_VERSION.zip" `
            $env:AHK2EXE_SHA256 "$tools\ahk2exe"
          "AHK_BASE=$tools\ahk\AutoHotkey64.exe" >> $env:GITHUB_ENV
          "AHK2EXE=$tools\ahk2exe\Ahk2Exe.exe" >> $env:GITHUB_ENV

      - name: Check cutout-mcode.ahk is built from cutout.c
        shell: powershell
        run: .\build-mcode.ps1 -Check

      - name: Cutout parity test
        shell: powershell
        run: |
          $out = "$env:RUNNER_TEMP\cutout-test.txt"
          $p = Start-Process $env:AHK_BASE -ArgumentList '/ErrorStdOut', 'tests\cutout.test.ahk' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "tests\cutout.test.ahk failed (exit code $($p.ExitCode))." }

      - name: Build
        shell: powershell
        run: .\build.ps1

      # sha256sum format (lowercase hex, two spaces, path), listing the zip and the exes inside it.
      - name: Write SHA256SUMS.txt
        shell: powershell
        run: |
          $unpacked = "$env:RUNNER_TEMP\unpacked"
          Expand-Archive dist\meowtab.zip -DestinationPath $unpacked
          $lines = foreach ($item in @(
              @('meowtab.zip', 'dist\meowtab.zip'),
              @('meowtab/meowtab.exe', "$unpacked\meowtab\meowtab.exe"),
              @('meowtab/meowtab-classic.exe', "$unpacked\meowtab\meowtab-classic.exe"))) {
            "$((Get-FileHash $item[1] -Algorithm SHA256).Hash.ToLower())  $($item[0])"
          }
          $text = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", $text, (New-Object Text.UTF8Encoding $false))
          Write-Host $text

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meowtab
          path: |
            dist/meowtab.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # The only job that can write to the repo. It makes a draft; a person publishes it.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: meowtab
          path: release

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "" release/meowtab.zip release/SHA256SUMS.txt
